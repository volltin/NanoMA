[project]
name = "nanoma"
version = "0.10.0"
description = "Minimal multi-agent harness (shell + workspace + meta tools, model aliases & fusion)"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pyflakes>=3",
]

[project.scripts]
nanoma = "nanoma.main:cli"
nanoma-run = "nanoma.task:cli"

[tool.setuptools]
packages = ["nanoma", "nanoma.tools"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
